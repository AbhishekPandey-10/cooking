; ============================================================================
; Disaster Health Monitoring Wearable — PlatformIO Configuration
; Board: ESP32-S3 DevKitC-1  |  Framework: Arduino
; ============================================================================

[env:esp32s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; --- Upload / Debug -----------------------------------------------------------
monitor_speed  = 115200
upload_speed   = 921600

; --- Build flags --------------------------------------------------------------
build_flags =
    -DCORE_DEBUG_LEVEL=3            ; ESP-IDF log level: INFO
    -DBOARD_HAS_PSRAM               ; S3 DevKit has PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; USB-CDC serial on boot

; --- Library dependencies -----------------------------------------------------
lib_deps =
    ; MAX30102 PPG / SpO2
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

    ; MPU6050 IMU (6-axis accel + gyro)
    electroniccats/MPU6050@^1.3.0

    ; MAX30205 body-temperature sensor
    protocentral/Protocentral MAX30205@^1.0.0

    ; BME280 environmental (temp / humidity / pressure)
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14

    ; SSD1306 OLED display
    adafruit/Adafruit SSD1306@^2.5.9
    adafruit/Adafruit GFX Library@^1.11.9

; --- Unit-test runner ---------------------------------------------------------
test_framework = unity
test_build_src = yes
